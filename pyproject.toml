[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "riemann"
version = "7.1.0"
description = "PDF reader and Web browser with integrated music mode"
requires-python = ">=3.11"

# The one list of Python dependencies. Install via: pip install .
# Optional features are installed on demand by the app at the versions in
# core/dependencies.py PINNED; the "bundled" and "extra" groups below repeat
# them (tests/test_dependency_lists.py checks the two agree), and
# scripts/lock_optional.py turns them into the hashed locks the app installs
# from (python-app/riemann/assets/requirements/). requirements/xreqs.txt
# is a lock generated from this file (requirements/requirements.sh); the
# Windows release compiles its own lock from it.
dependencies = [
    "asn1crypto==1.5.1",
    "certifi==2026.7.22",
    "fastapi==0.141.1",
    "lxml==6.1.3",
    "Markdown==3.10.1",
    "numpy==2.4.6",
    "onnxruntime==1.29.0",
    "pikepdf==10.5.0",
    "Pillow==12.3.0",
    "psutil==7.2.2",
    "pydantic==2.13.5",
    "pyHanko==0.33.0",
    "pyhanko-certvalidator==0.29.1",
    "pypdf==6.7.5",
    "PySide6==6.10.1",
    "requests==2.34.2",
    "tokenizers==0.23.2",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]

# Shipped inside release builds. Install via: pip install .[bundled]
bundled = [
    "mammoth==1.13.0",
    "openpyxl==3.1.5",
    "Pygments==2.21.0",
    "python-pptx==1.0.2",
    "striprtf==0.0.35",
    "xlrd==2.0.2",
    "yt-dlp==2026.10.26",
    "yt-dlp-ejs==0.8.0",
]

# Heavy features (Snip-to-LaTeX, local captions). Install via: pip install .[extra]
extra = [
    "deno==2.9.8",
    "faster-whisper==1.2.1",
    "opencv-python-headless==5.0.0.93",
    "pandas==3.0.5",
    "pix2tex[gui]==0.1.4",
    "scipy==1.17.1",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.16.1",
]

# Install via: pip install .[dev]
dev = [
    "httpx==0.28.1",
    "maturin==1.11.5",
    "Nuitka==4.2",
    "pip-tools==7.6.1",
    "pyinstaller==6.18.0",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
]

[tool.maturin]
manifest-path = "rust-core/Cargo.toml"

[tool.pytest.ini_options]
addopts = "--capture=fd"