name: Build and Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug mode"
        required: false
        default: "false"

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # 🔧 CACHING LAYER
      # =========================

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Nuitka C-Compiler
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Cache AI Sidecar
        id: cache-ai
        uses: actions/cache@v4
        with:
          path: python-app/riemann/assets/riemann_ai_engine
          key: ${{ runner.os }}-ai-${{ hashFiles('riemann-ai/**') }}

      # =========================
      # ⚙️ LANGUAGE SETUP
      # =========================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Global Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin nuitka zstandard

      - name: Debug Python + pip
        run: |
          python --version
          pip --version

      # =========================
      # 🧠 STAGE 1: AI SIDECAR
      # =========================

      - name: Install AI Dependencies
        run: pip install -r riemann-ai/requirements.txt

      - name: Compile AI Sidecar (Nuitka)
        if: steps.cache-ai.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $EXCLUDES = "--nofollow-import-to=torch --nofollow-import-to=transformers --nofollow-import-to=cv2 --nofollow-import-to=scipy --nofollow-import-to=pandas"
          $EXCLUDE_ARGS = $EXCLUDES.Split(" ")

          python -m nuitka `
              --standalone `
              --assume-yes-for-downloads `
              --module-parameter=torch-disable-jit=yes `
              --output-dir=dist_ai `
              @EXCLUDE_ARGS `
              riemann-ai/main.py

          if ($LASTEXITCODE -ne 0) { 
              Write-Host "FATAL ERROR: AI Engine Nuitka compilation failed." -ForegroundColor Red
              exit $LASTEXITCODE 
          }

      - name: Position AI Engine into Assets
        if: steps.cache-ai.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "python-app\riemann\assets\riemann_ai_engine"
          Move-Item -Path "dist_ai\main.dist\*" -Destination "python-app\riemann\assets\riemann_ai_engine\" -Force
          Remove-Item -Recurse -Force dist_ai -ErrorAction SilentlyContinue

      # =========================
      # ⚙️ STAGE 2: MAIN APP
      # =========================

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Compile requirements (Windows)
        run: pip-compile --resolver=backtracking --output-file requirements/wreqs.txt requirements/requirements.in

      - name: Upload compiled requirements
        uses: actions/upload-artifact@v4
        with:
          name: wreqs
          path: requirements/wreqs.txt

      - name: Install dependencies
        run: pip install -r requirements/wreqs.txt

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: ${{ runner.os }}-vcpkg-ocr-static-md

      - name: Install OCR C++ Libraries (vcpkg)
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install leptonica tesseract --triplet x64-windows-static-md

      - name: Build Rust Backend
        shell: bash
        run: |
          maturin build --release --out dist-wheels
          pip install dist-wheels/*.whl

      - name: Move Rust Extension
        shell: python
        run: |
          import shutil, os, glob
          import riemann_core
          
          base_dir = os.path.dirname(riemann_core.__file__)
          libs = glob.glob(os.path.join(base_dir, '*.pyd'))
          
          if not libs:
              raise FileNotFoundError("FATAL: Could not find compiled Rust extension in " + base_dir)
          src = libs[0]
          
          dst = os.path.join('python-app', 'riemann', 'riemann_core.pyd')
          print(f"Moving {src} -> {dst}")
          shutil.copy2(src, dst)

      - name: Check the app imports on Windows
        # Fails in about a minute on Unix-only imports and similar mistakes,
        # instead of producing an exe that exits silently on launch.
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$(Get-Location)\python-app"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import riemann.app; print('riemann.app imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # =========================
      # 🚀 STAGE 3: FINAL BUILD
      # =========================

      - name: Build Main Application (Nuitka)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$(Get-Location)\python-app"
          
          $EXCLUDES="--nofollow-import-to=torch --nofollow-import-to=torchvision --nofollow-import-to=cv2 --nofollow-import-to=pix2tex"
          $EXCLUDES="$EXCLUDES --nofollow-import-to=transformers --nofollow-import-to=scipy --nofollow-import-to=pandas"
          $EXCLUDES="$EXCLUDES --nofollow-import-to=nvidia --nofollow-import-to=fitz --nofollow-import-to=pymupdf" 
          $EXCLUDES="$EXCLUDES --nofollow-import-to=yt_dlp.extractor.lazy_extractors --nofollow-import-to=pygments"
          $EXCLUDES="$EXCLUDES --nofollow-import-to=faster_whisper --nofollow-import-to=ctranslate2 --nofollow-import-to=huggingface_hub --nofollow-import-to=tokenizers"
          
          $EXCLUDE_ARGS = $EXCLUDES.Split(" ")

          python -m nuitka `
              --onefile `
              --assume-yes-for-downloads `
              --lto=no `
              --enable-plugin=pyside6 `
              --include-package=riemann `
              --include-data-dir=python-app/riemann/assets=riemann/assets `
              --noinclude-data-files=riemann/assets/riemann_ai_engine/* `
              --include-raw-dir=python-app/riemann/assets/riemann_ai_engine=riemann/assets/riemann_ai_engine `
              --include-data-file=libs/pdfium.dll=pdfium.dll `
              --windows-console-mode=attach `
              <# --windows-icon-from-ico=python-app/riemann/assets/icons/icon.ico #> `
              --output-dir=dist `
              --output-filename=Riemann.exe `
              @EXCLUDE_ARGS `
              build_entry.py

          if ($LASTEXITCODE -ne 0) { 
              Write-Host "FATAL ERROR: Main App Nuitka compilation failed." -ForegroundColor Red
              exit $LASTEXITCODE 
          }

      - name: Smoke test the built exe
        # Starts Riemann.exe and expects it to open its window and quit on its
        # own (RIEMANN_SMOKE_TEST). A startup crash fails the job and prints
        # the crash log written by build_entry.py.
        shell: pwsh
        run: |
          $env:RIEMANN_SMOKE_TEST = "8000"
          $p = Start-Process -FilePath "dist\Riemann.exe" -PassThru
          if (-not $p.WaitForExit(240000)) {
              Stop-Process -Id $p.Id -Force
              Write-Host "Riemann.exe did not quit within 4 minutes (hung at startup?)" -ForegroundColor Red
              $code = 1
          } else {
              $code = $p.ExitCode
          }
          $log = Join-Path $env:LOCALAPPDATA "Riemann\crash.log"
          if ((Test-Path $log) -and (Get-Item $log).Length -gt 0) {
              Write-Host "---- crash.log ----"
              Get-Content $log
              $code = 1
          }
          Write-Host "Exit code: $code"
          exit $code

      # =========================
      # 📦 STAGE 4: PACKAGE + RELEASE
      # =========================
          
      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Riemann-Windows
          path: dist/Riemann.exe

      - name: Zip Artifact
        shell: bash
        run: |
          7z a Riemann-Windows.zip ./dist/Riemann.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Riemann-Windows.zip