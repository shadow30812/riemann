name: Build and Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug mode"
        required: false
        default: "false"

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # 🔧 CACHING LAYER
      # =========================

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Nuitka C-Compiler
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      # =========================
      # ⚙️ LANGUAGE SETUP
      # =========================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Global Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin nuitka zstandard

      - name: Debug Python + pip
        run: |
          python --version
          pip --version

      # =========================
      # ⚙️ STAGE 2: MAIN APP
      # =========================

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Compile requirements (Windows)
        run: pip-compile --resolver=backtracking --extra bundled --output-file requirements/wreqs.txt pyproject.toml

      - name: Upload compiled requirements
        uses: actions/upload-artifact@v4
        with:
          name: wreqs
          path: requirements/wreqs.txt

      - name: Install dependencies
        run: pip install -r requirements/wreqs.txt

      - name: Fetch PDFium (pinned by SHA-256)
        run: python scripts/fetch_pdfium.py win-x64

      - name: Build Rust Backend
        shell: bash
        run: |
          maturin build --release --out dist-wheels
          pip install dist-wheels/*.whl

      - name: Move Rust Extension
        shell: python
        run: |
          import shutil, os, glob
          import riemann_core
          
          base_dir = os.path.dirname(riemann_core.__file__)
          libs = glob.glob(os.path.join(base_dir, '*.pyd'))
          
          if not libs:
              raise FileNotFoundError("FATAL: Could not find compiled Rust extension in " + base_dir)
          src = libs[0]
          
          dst = os.path.join('python-app', 'riemann', 'riemann_core.pyd')
          print(f"Moving {src} -> {dst}")
          shutil.copy2(src, dst)

      - name: Check the app imports on Windows
        # Fails in about a minute on Unix-only imports and similar mistakes,
        # instead of producing an exe that exits silently on launch.
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$(Get-Location)\python-app"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import riemann.app; print('riemann.app imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import onnxruntime, tokenizers, fastapi, uvicorn; import riemann.core.ai_server; print('AI engine imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # =========================
      # 🚀 STAGE 3: FINAL BUILD
      # =========================

      - name: Build Main Application (Nuitka)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$(Get-Location)\python-app"
          
          $EXCLUDE_ARGS = Get-Content scripts/build-excludes.txt |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith('#') } |
              ForEach-Object { "--nofollow-import-to=$_" }

          python -m nuitka `
              --onefile `
              --assume-yes-for-downloads `
              --lto=no `
              --enable-plugin=pyside6 `
              --include-package=riemann `
              --include-data-dir=python-app/riemann/assets=riemann/assets `
              --noinclude-data-files=riemann/assets/__tests__/* `
              --noinclude-data-files=riemann/assets/*.log `
              --include-package=onnxruntime `
              --include-package-data=onnxruntime `
              --noinclude-data-files=onnxruntime/datasets/* `
              --noinclude-data-files=onnxruntime/tools/* `
              --include-package=tokenizers `
              --include-package=uvicorn `
              --include-package=yt_dlp_ejs `
              --include-package-data=yt_dlp_ejs `
              --include-package=mammoth `
              --include-package=pptx `
              --include-package=openpyxl `
              --include-package=xlrd `
              --include-package=striprtf `
              --include-data-file=libs/pdfium.dll=pdfium.dll `
              --windows-console-mode=attach `
              --windows-icon-from-ico=python-app/riemann/assets/icons/windows-icon.ico `
              --output-dir=dist `
              --output-filename=Riemann.exe `
              @EXCLUDE_ARGS `
              build_entry.py

          if ($LASTEXITCODE -ne 0) { 
              Write-Host "FATAL ERROR: Main App Nuitka compilation failed." -ForegroundColor Red
              exit $LASTEXITCODE 
          }

      - name: Smoke test the built exe
        # Starts Riemann.exe and expects it to open its window and quit on its
        # own (RIEMANN_SMOKE_TEST). A startup crash fails the job and prints
        # the crash log written by build_entry.py.
        shell: pwsh
        run: |
          $env:RIEMANN_SMOKE_TEST = "8000"
          $p = Start-Process -FilePath "dist\Riemann.exe" -PassThru
          if (-not $p.WaitForExit(240000)) {
              Stop-Process -Id $p.Id -Force
              Write-Host "Riemann.exe did not quit within 4 minutes (hung at startup?)" -ForegroundColor Red
              $code = 1
          } else {
              $code = $p.ExitCode
          }
          $log = Join-Path $env:LOCALAPPDATA "Riemann\crash.log"
          if ((Test-Path $log) -and (Get-Item $log).Length -gt 0) {
              Write-Host "---- crash.log ----"
              Get-Content $log
              $code = 1
          }
          Write-Host "Exit code: $code"
          exit $code

      - name: Smoke test the AI engine inside the exe
        # Runs Riemann.exe as the AI engine (--riemann-ai-sidecar), waits for
        # it to download and load the search model (pinned by SHA-256), and
        # embeds one sentence, so a packaging miss (onnxruntime DLLs, uvicorn
        # protocol modules) fails here instead of on a user's machine.
        shell: pwsh
        run: |
          $env:RIEMANN_AI_PORT = "8765"
          $env:RIEMANN_AI_TOKEN = "ci"
          $env:RIEMANN_AI_MODELS = Join-Path $env:RUNNER_TEMP "riemann-model"
          $p = Start-Process -FilePath "dist\Riemann.exe" -ArgumentList "--riemann-ai-sidecar" -PassThru
          $headers = @{ "X-Riemann-Token" = "ci" }
          $state = ""
          for ($i = 0; $i -lt 300; $i++) {
            Start-Sleep -Seconds 1
            try {
              $state = (Invoke-RestMethod -Uri "http://127.0.0.1:8765/status" -Headers $headers).status
              if ($state -eq "ready" -or $state -eq "failed") { break }
            } catch { }
          }
          Write-Host "AI engine status: $state"
          $code = 1
          if ($state -eq "ready") {
            $body = '{"text_chunk": "gradient descent trains neural networks", "tags": ["Machine Learning", "Cooking"]}'
            $tags = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/tag" -Headers $headers -ContentType "application/json" -Body $body
            Write-Host "Tags: $($tags.tags)"
            if ($tags.tags -contains "Machine Learning") { $code = 0 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          exit $code

      # =========================
      # 📦 STAGE 4: PACKAGE + RELEASE
      # =========================
          
      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Riemann-Windows
          path: dist/Riemann.exe

      - name: Zip Artifact
        shell: bash
        run: |
          7z a Riemann-Windows.zip ./dist/Riemann.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Riemann-Windows.zip