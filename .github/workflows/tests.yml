# Runs every test suite on pushes and pull requests: the Python app (offscreen
# Qt), the start page's JavaScript (Jest, versions from package-lock.json), the
# Rust OCR worker and the Rust core, plus a lint for undefined and unused names.
# LibreOffice comes from Ubuntu's packages, so the Office conversion tests run.
# PDFium and the benchmark PDFs are downloaded by their own scripts, each
# pinned by SHA-256. The AI model's tests download it the way
# the app does (pinned commit, SHA-256 per file) into a folder kept in the
# Actions cache, keyed by that commit, so it is fetched once per model version.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      RIEMANN_PDFIUM_DIR: ${{ github.workspace }}/libs

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/xreqs.txt') }}

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tests-${{ hashFiles('**/Cargo.lock') }}

      - name: System packages (Qt offscreen, Tesseract, LibreOffice without its interface)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui \
            tesseract-ocr libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 \
            libpulse0 libxkbfile1 libxshmfence1 libgbm1 libxcb-dri3-0 libxi6 libatomic1

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/xreqs.txt
          pip install maturin==1.11.5 pytest==9.1.1 httpx==0.28.1

      - name: Fetch PDFium and the benchmark PDFs
        run: |
          python scripts/fetch_pdfium.py linux-x64
          python benchmarks/fetch_corpus.py

      - name: Build the Rust core
        run: |
          maturin build --release --out dist-wheels
          pip install --no-deps dist-wheels/*.whl

      - name: Lint
        run: pipx run ruff check --select F python-app/riemann python-app/tests

      - name: Pick the AI model's cache key
        id: model
        run: echo "commit=$(sed -n 's/^MODEL_COMMIT = "\(.*\)"$/\1/p' python-app/riemann/core/ai_server.py)" >> "$GITHUB_OUTPUT"

      - name: Cache the AI model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ai-model
          key: ai-model-${{ steps.model.outputs.commit }}

      - name: Python tests
        working-directory: python-app
        env:
          RIEMANN_TEST_AI_MODELS: ${{ runner.temp }}/ai-model
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript tests (start page, audio engine)
        run: |
          npm ci
          npx jest python-app/riemann/assets/__tests__

      - name: Rust tests
        run: |
          cargo test -p riemann_ocr_worker
          cd rust-core
          PYO3_PYTHON="$(which python)" LD_LIBRARY_PATH="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" cargo test --no-default-features
