[package]
name = "riemann_core"
version = "7.4.20"
edition = "2021"

[lib]
name = "riemann_core"
crate-type = ["cdylib"]

[dependencies]
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_7543", "thread_safe"] }
once_cell = "1.18"
anyhow = "1.0"
riemann_ocr_worker = { path = "../rust-ocr-worker" }

[dependencies.pyo3]
version = "0.30.1"
features = ["abi3-py311"]

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[dev-dependencies]
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }